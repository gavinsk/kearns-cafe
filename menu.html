<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kearns Café Menus</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    /* Printable menus, built from the same menu files the register uses (menus/*.js) */
    :root { --ink: #2b2b2b; --muted: #6b6b6b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e9e6e1; color: var(--ink); }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif; }

    .toolbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; gap: 10px; align-items: center; justify-content: center;
      padding: 12px; background: #2b2b2b; color: #fff;
    }
    .toolbar button, .toolbar a {
      font: inherit; font-weight: 700; font-size: 16px; color: #2b2b2b; text-decoration: none;
      background: #fff; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    }

    /* One sheet of letter paper per shop */
    .page {
      width: 8.5in; min-height: 11in;
      margin: 24px auto;
      background: var(--bg);
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      display: flex; flex-direction: column;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
      overflow: hidden;
    }
    .head {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; text-align: center; padding: 0.22in 0.4in 0.2in;
    }
    .head .logo { font-size: 48px; line-height: 1; }
    .head h1 { margin: 4px 0 0; font-size: 38px; letter-spacing: -0.5px; }
    .head p { margin: 0; font-size: 16px; font-weight: 600; opacity: 0.95; }

    .cols { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.22in; padding: 0.2in 0.35in 0.05in; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 0.14in; min-width: 0; }
    .cat {
      break-inside: avoid;
      background: #fff; border-radius: 14px; padding: 8px 14px 8px;
      border-top: 6px solid var(--primary);
    }
    .cat h2 { margin: 0 0 2px; font-size: 20px; color: var(--primary); }
    .item { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; font-size: 15px; }
    .item .e { width: 24px; text-align: center; font-size: 17px; }
    .item .n { font-weight: 700; }
    .item .dots { flex: 1; border-bottom: 2px dotted #c9c3bb; transform: translateY(-4px); min-width: 12px; }
    .item .p { font-weight: 800; }
    .opts { margin-top: 4px; padding-top: 4px; border-top: 1px solid #eee; font-size: 11.5px; color: var(--muted); line-height: 1.35; }
    .opts b { color: var(--ink); }

    .foot { text-align: center; padding: 0.1in 0.4in 0.2in; font-size: 13px; color: var(--muted); }
    .foot b { color: var(--primary); }

    @media print {
      @page { size: letter; margin: 0; }
      html, body { background: #fff; }
      .toolbar { display: none; }
      .page { margin: 0; box-shadow: none; min-height: 11in; break-after: page; }
      .page:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="./">← Back to register</a>
    <button onclick="window.print()">🖨️ Print menus</button>
  </div>
  <div id="pages"></div>

  <script src="menus/donuts.js"></script>
  <script src="menus/burgers.js"></script>
  <script>
    (function () {
      const money = (n) => "$" + n.toFixed(2);
      const plus = (n) => n < 1 ? "+" + Math.round(n * 100) + "¢" : "+" + money(n);

      // Describe an option group in one line, e.g. "Size: Small, Medium +50¢, Large +$1.00"
      function optionLine(g) {
        const label = g.label.replace(/\s*\(.*\)$/, "").replace(/\?$/, "");
        const choices = g.choices.map((c) => c.name + (c.price ? " " + plus(c.price) : "")).join(", ");
        if (g.startAll) return `<b>Comes with:</b> ${choices} (ask to leave any off)`;
        return `<b>${label}:</b> ${choices}`;
      }

      function shopPage(m) {
        // Rough height of each section, so the two columns come out about even
        const weight = (c) => {
          const items = m.items.filter((i) => i.cat === c.id);
          const groups = new Set();
          items.forEach((i) => (i.options || []).forEach((g) => groups.add(g)));
          // option lines wrap at roughly 60 characters
          let optLines = 0;
          groups.forEach((g) => { optLines += Math.ceil(optionLine(m.optionGroups[g]).replace(/<[^>]+>/g, "").length / 60) * 0.7; });
          return 2 + items.length + optLines;
        };
        const cols = [[], []];
        const heights = [0, 0];
        m.categories.forEach((c) => {
          const k = heights[0] <= heights[1] ? 0 : 1;
          cols[k].push(c);
          heights[k] += weight(c);
        });

        const section = (c) => {
          const items = m.items.filter((i) => i.cat === c.id);
          // Option groups used in this section, listed once underneath
          const groups = [];
          items.forEach((i) => (i.options || []).forEach((gid) => { if (!groups.includes(gid)) groups.push(gid); }));
          return `
            <section class="cat">
              <h2>${c.emoji} ${c.name}</h2>
              ${items.map((i) => `
                <div class="item"><span class="e">${i.emoji}</span><span class="n">${i.name}</span><span class="dots"></span><span class="p">${money(i.price)}</span></div>`).join("")}
              ${groups.length ? `<div class="opts">${groups.map((g) => optionLine(m.optionGroups[g])).join("<br>")}</div>` : ""}
            </section>`;
        };
        const cats = cols.map((list) => `<div class="col">${list.map(section).join("")}</div>`).join("");

        return `
          <article class="page" style="--primary:${m.theme.primary};--accent:${m.theme.accent};--bg:${m.theme.bg}">
            <header class="head">
              <div class="logo">${m.emoji}</div>
              <h1>${m.name}</h1>
              <p>${m.tagline}</p>
            </header>
            <div class="cols">${cats}</div>
            <footer class="foot">Order at the counter · We take cash, cards & <b>Kearns Bank</b> cards ⭐ Earn a free treat every 8 visits!</footer>
          </article>`;
      }

      const only = new URLSearchParams(location.search).get("shop");
      const shops = Object.values(window.MENUS).filter((m) => !only || m.id === only);
      document.getElementById("pages").innerHTML = shops.map(shopPage).join("");
    })();
  </script>
</body>
</html>
